name: 🐞 버그 리포트
description: 오작동·크래시·예상과 다른 동작을 신고합니다
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        버그 재현에 필요한 정보를 최대한 채워주세요. 로그·스크린샷이 있으면 큰 도움이 됩니다.
        > ⚠️ **민감정보 주의:** 로그/증적을 붙일 때 `ca.key`, `secret.key`, 실계정 비밀번호, 진단 대상의 실제 인증정보는 마스킹하거나 제거해주세요.

  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요?
      description: 실제 발생한 현상을 설명해주세요.
      placeholder: 스캔 실행 중 프록시가 종료됩니다...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 원래 어떻게 동작해야 한다고 생각했나요?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 재현 순서를 단계별로 적어주세요.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 영향 받는 구성요소
      options:
        - 프록시 엔진 (:8080 / MITM)
        - MCP 오케스트레이션 (:8765)
        - 웹 GUI (:8090)
        - 탐지기 (Detector)
        - 리포트/산출물 (xlsx·CSV)
        - 인증/RBAC/암호화
        - 빌드/배포 (go build·embed)
        - 기타/모르겠음
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
      description: 관련 콘솔 로그, 프록시 로그, 스크린샷을 붙여주세요. (민감값 마스킹 필수)
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: OS, Go 버전, Node 버전, 브라우저 등
      value: |
        - OS:
        - Go: `go version`
        - Node: `node -v`
        - 브라우저:
        - 커밋/버전:
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 중복 이슈가 없는지 검색했습니다.
          required: true
        - label: 첨부한 로그/증적에서 민감정보를 제거했습니다.
          required: true
