# CodeRabbit 설정 — 자동 리뷰 비활성화
# 이 파일은 기본 브랜치(main)에 있어야 적용된다. CodeRabbit 이 PR 의 base 브랜치에서 설정을 읽기 때문.
# 참고: https://docs.coderabbit.ai/reference/configuration
reviews:
  # 새 PR/푸시에 대한 자동 리뷰를 끈다.
  auto_review:
    enabled: false
  # PR 요약/워크스루 등 자동 산출물도 끈다.
  high_level_summary: false
  poem: false
  review_status: false
# 채팅 호출(@coderabbitai) 자체는 남지만, 자동으로 리뷰를 시작하지 않는다.
