# 정찰 벤치마크 정답셋 — OWASP Juice Shop (#22)
#
# 매칭 규칙: 하네스 자체 canonical(bench.Canon) 로 접힌다.
#   가변 세그먼트(숫자/uuid/hex/date, 그리고 아래 {id} 플레이스홀더)는 "{}" 로 접혀
#   구체 경로(/rest/products/42)와 매칭된다. 정적 세그먼트는 대소문자까지 그대로 비교.
#   (path 에 {} 가 있어 YAML flow 충돌을 피하려 값을 따옴표로 감싼다.)
#
# ⚠️ 이 정답셋은 대표 엔드포인트 큐레이션이다. 실제 기동 버전에 맞춰 검증·확장할 것.
#   (Juice Shop 은 버전에 따라 라우트가 조금씩 다르다. baseline 기록 시 사용한 버전을 남길 것.)
app: juice-shop
base: http://localhost:3000
endpoints:
  # 상품
  - { method: GET,  path: "/rest/products/search" }
  - { method: GET,  path: "/api/Products" }
  - { method: GET,  path: "/api/Products/{id}" }
  - { method: GET,  path: "/rest/products/{id}/reviews" }
  - { method: PUT,  path: "/rest/products/{id}/reviews" }
  # 사용자 / 인증
  - { method: POST, path: "/rest/user/login" }
  - { method: GET,  path: "/rest/user/whoami" }
  - { method: POST, path: "/api/Users" }
  - { method: GET,  path: "/api/Users/{id}" }
  - { method: POST, path: "/rest/user/reset-password" }
  - { method: GET,  path: "/rest/user/security-question" }
  # 장바구니 / 주문
  - { method: GET,  path: "/rest/basket/{id}" }
  - { method: POST, path: "/api/BasketItems" }
  - { method: PUT,  path: "/api/BasketItems/{id}" }
  - { method: GET,  path: "/rest/order-history" }
  - { method: GET,  path: "/rest/wallet/balance" }
  # 피드백 / 컴플레인
  - { method: GET,  path: "/api/Feedbacks" }
  - { method: POST, path: "/api/Feedbacks" }
  - { method: GET,  path: "/api/Complaints" }
  - { method: POST, path: "/api/Complaints" }
  # 관리 / 메타
  - { method: GET,  path: "/api/Challenges" }
  - { method: GET,  path: "/rest/admin/application-version" }
  - { method: GET,  path: "/rest/admin/application-configuration" }
  - { method: GET,  path: "/rest/languages" }
  - { method: GET,  path: "/api/SecurityQuestions" }
  - { method: POST, path: "/api/SecurityAnswers" }
  - { method: GET,  path: "/api/Cards" }
  - { method: GET,  path: "/api/Addresss" }
  - { method: GET,  path: "/api/Deliverys" }
  - { method: GET,  path: "/rest/captcha" }
  - { method: GET,  path: "/metrics" }
  # 능동 발견(#27)이 wordlist 프로브로 찾은 unlinked 공격면. 링크·명세·트래픽 어디에도
  # 안 걸려 크롤·인제스트로는 도달 불가. 전부 실재 확인(SPA catch-all 9393B 와 구분됨).
  #   /support/logs   : 200 text/html 8891B — 디렉터리 목록 노출(로그)
  #   /encryptionkeys : 200 text/html 7951B — 디렉터리 목록 노출(키)
  #   /.well-known/security.txt : 200 text/plain 475B — 표준 보안 연락처
  #   /api-docs       : 301 → /api-docs/ (Swagger UI) — API 문서 노출
  - { method: GET,  path: "/support/logs" }
  - { method: GET,  path: "/encryptionkeys" }
  - { method: GET,  path: "/.well-known/security.txt" }
  - { method: GET,  path: "/api-docs" }
  # 라이브니스 검증(#26)에서 실재가 확인된 정답셋 누락 2건.
  # 판정 기준은 "앱이 처리하는 라우트인가" 다 — 위 /api/Cards·/api/Addresss 도 401 을 주지만
  # 정답셋에 있다. SPA catch-all(text/html 9393 bytes)과 구분되는 응답이면 라우트는 실재한다.
  #   /api/Quantitys : 200 application/json 7628B — 실제 재고 데이터
  #   /api/Recycles  : 200 application/json 76B  — {"data":{"err":"...not supported."}}
  #     ⚠ GET 은 앱이 명시적으로 거부한다(POST 는 지원). 라우트 자체는 실재하며 공격면이라 포함.
  #        method 단위로 엄격히 보려면 이 줄을 빼고 아래 근거를 남길 것.
  - { method: GET,  path: "/api/Quantitys" }
  - { method: GET,  path: "/api/Recycles" }
  # robots.txt 가 가리키는 디렉터리 목록 (#25 스펙 인제스트로 발견된 정답셋 누락)
  #   실재 확인: curl -s http://localhost:3000/ftp → 11307 bytes, .bak/.json/.md 노출
  #   (SPA catch-all 인 index.html 은 9393 bytes 로 다르다)
  - { method: GET,  path: "/ftp" }
  # #61 static 벤치 실측 — 오탐 28건 중 26건을 curl로 개별 검증(SPA catch-all 9393B 와 응답이
  # 다름 = 실재). REST 스캐폴딩 리소스는 GET(목록/조회)·POST(생성)을 모두 지원해 메서드가 다른
  # 항목을 GT 에 추가했다(예: POST /api/Users 는 이미 있고, GET /api/Users 를 여기 추가).
  # 나머지는 그 자체로 GT 에 없던 실제 백엔드 라우트(Continue Code 기능·프로필·오픈리다이렉트 등).
  - { method: GET,  path: "/api/Users" }              # curl → 401 (기존 POST /api/Users 와 별개 라우트)
  - { method: GET,  path: "/api/BasketItems" }         # curl → 401
  - { method: GET,  path: "/api/SecurityAnswers" }     # curl → 401
  - { method: GET,  path: "/rest/user/login" }         # curl → 500 (기존 POST 는 로그인 처리, GET 은 별도)
  - { method: GET,  path: "/rest/user/reset-password" }# curl → 500
  - { method: GET,  path: "/rest/user" }               # curl → 500
  - { method: GET,  path: "/rest/user/authentication-details" } # curl → 401
  - { method: GET,  path: "/rest/user/change-password" }        # curl → 401
  - { method: GET,  path: "/rest/admin" }              # curl → 500
  - { method: GET,  path: "/rest/products" }           # curl → 500
  - { method: GET,  path: "/rest/web3" }               # curl → 500
  - { method: GET,  path: "/rest/country-mapping" }    # curl → 500
  - { method: GET,  path: "/rest/deluxe-membership" }  # curl → 400 application/json
  - { method: GET,  path: "/rest/image-captcha" }      # curl → 401
  - { method: GET,  path: "/rest/repeat-notification" }# curl → 200 text/plain 2B
  - { method: GET,  path: "/rest/saveLoginIp" }        # curl → 401
  - { method: GET,  path: "/rest/track-order" }        # curl → 500
  - { method: GET,  path: "/rest/continue-code" }             # curl → 200 text/plain 79B
  - { method: GET,  path: "/rest/continue-code/apply" }       # curl → 500 (코드 파라미터 없음)
  - { method: GET,  path: "/rest/continue-code-findIt" }      # curl → 200 text/plain 2B
  - { method: GET,  path: "/rest/continue-code-findIt/apply" }# curl → 500
  - { method: GET,  path: "/rest/continue-code-fixIt" }       # curl → 200 text/plain 2B
  - { method: GET,  path: "/rest/continue-code-fixIt/apply" } # curl → 500
  - { method: GET,  path: "/profile" }    # curl → 500 (레거시 서버렌더 프로필 페이지 — XSS 챌린지)
  - { method: GET,  path: "/redirect" }   # curl → 500 (오픈 리다이렉트 챌린지, ?to= 파라미터 필요)
  - { method: GET,  path: "/dataerasure" }# curl → 500 (GDPR 데이터 삭제 폼)
