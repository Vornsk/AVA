# 점검항목표 — 공유/버전관리 (문서 §6, 3계층: VulnDef→CheckItem, detector는 코드)
vulns:
    - id: vuln.sqli
      이름: SQL 인젝션
      설명: 입력값 검증 미흡으로 악의적 SQL 구문 실행(에러/불린·시간 블라인드)
      detector:
        - sqli
        - sqli-blind
        - sqli-time
      cwe: CWE-89
    - id: vuln.xss
      이름: 크로스사이트 스크립트(XSS)
      설명: 입력값이 검증 없이 응답에 반사/저장되어 스크립트가 실행됨
      detector:
        - reflected-input
        - stored-xss
        - dom-xss
      cwe: CWE-79
    - id: vuln.csrf
      이름: 크로스사이트 요청 위조(CSRF)
      설명: 위조 요청 방지 토큰 부재로 사용자 의도와 무관한 요청 강제
      detector:
        - csrf
      cwe: CWE-352
    - id: vuln.file-upload
      이름: 악성 파일 업로드
      설명: 확장자·타입 검증 미흡으로 실행 가능 파일 업로드
      detector:
        - file-upload
      cwe: CWE-434
    - id: vuln.file-download
      이름: 파일 다운로드 / 경로 순회
      설명: 다운로드 경로 검증 미흡으로 경로 순회·시스템 파일 노출
      detector:
        - path-traversal
      cwe: CWE-22
    - id: vuln.access-control
      이름: 접근통제 미흡(권한검증/관리자페이지 노출)
      설명: 인증·권한 검증 미흡으로 타 사용자/상위 권한 자원 접근, 관리자 페이지 노출
      detector:
        - idor
        - privesc
      cwe: CWE-639
    - id: vuln.info-exposure
      이름: 정보 누출
      설명: 주민등록번호·카드·계좌 등 민감정보가 응답에 노출됨
      detector:
        - sensitive-data
      cwe: CWE-200
    - id: vuln.code-injection
      이름: 코드 인젝션
      설명: 입력값이 코드/OS 명령으로 해석·실행됨
      detector:
        - cmd-injection
      cwe: CWE-94
    - id: vuln.dir-indexing
      이름: 디렉터리 인덱싱
      설명: 디렉터리 목록이 그대로 노출됨
      detector:
        - dir-indexing
      cwe: CWE-548
    - id: vuln.error-page
      이름: 에러 페이지 적용 미흡
      설명: 에러 페이지로 내부 정보 노출
      detector: []
      cwe: CWE-209
    - id: vuln.ssrf
      이름: 서버사이드 요청 위조(SSRF)
      설명: 서버가 임의 목적지로 요청을 대신 수행
      detector:
        - ssrf
      cwe: CWE-918
    - id: vuln.weak-password
      이름: 약한 비밀번호 정책
      설명: 비밀번호 복잡도·정책 미흡
      detector: []
      cwe: CWE-521
    - id: vuln.weak-auth
      이름: 불충분한 인증 절차
      설명: 인증 우회·미흡
      detector: []
      cwe: CWE-287
    - id: vuln.weak-pw-recovery
      이름: 취약한 비밀번호 복구 절차
      설명: 비밀번호 재설정 로직 취약
      detector: []
      cwe: CWE-640
    - id: vuln.process-validation
      이름: 프로세스 검증 누락
      설명: 업무 흐름·순서 검증 미흡(로직 우회)
      detector: []
      cwe: CWE-841
    - id: vuln.weak-session
      이름: 불충분한 세션 관리
      설명: 세션 고정·만료·재사용 관리 미흡
      detector: []
      cwe: CWE-384
    - id: vuln.plaintext
      이름: 데이터 평문 전송
      설명: 중요정보를 암호화 없이 전송
      detector: []
      cwe: CWE-319
    - id: vuln.cookie-tampering
      이름: 쿠키 변조
      설명: 쿠키 무결성·보안속성 미흡으로 변조 가능
      detector:
        - cookie-security
      cwe: CWE-565
    - id: vuln.automation
      이름: 자동화 공격
      설명: 자동화 요청 차단(캡차·속도제한) 미흡
      detector: []
      cwe: CWE-799
    - id: vuln.http-method
      이름: 불필요한 Method 악용
      설명: PUT/DELETE/TRACE 등 위험 메소드 허용
      detector:
        - http-method
      cwe: CWE-650
    - id: vuln.weak-tls
      이름: 취약한 SSL/TLS 설정
      설명: 구버전 프로토콜·취약 cipher 허용
      detector:
        - sslscan
        - openssl-tls
      cwe: CWE-326
    - id: vuln.sec-headers
      이름: 미흡한 보안 헤더
      설명: HSTS/CSP/X-Frame-Options 등 보안 응답 헤더 누락
      detector:
        - sec-headers
      cwe: CWE-693
    - id: vuln.open-redirect
      이름: 오픈 리다이렉트
      설명: 리다이렉트 목적지 미검증으로 외부 악성 사이트 유도
      detector:
        - open-redirect
      cwe: CWE-601
    - id: vuln.xxe
      이름: XML 외부객체 공격(XXE)
      설명: XML 입력 검증 미흡으로 내부 자원 접근·외부 명령 실행
      detector:
        - xxe
      cwe: CWE-611
    - id: vuln.ldap-injection
      이름: LDAP 인젝션
      설명: LDAP 쿼리 입력 검증 미흡으로 데이터 유출·명령 실행
      detector:
        - ldap-injection
      cwe: CWE-90
    - id: vuln.ssi-injection
      이름: SSI 인젝션
      설명: 서버측 인클루드(SSI) 명령 삽입 실행
      detector:
        - ssi-injection
      cwe: CWE-97
    - id: vuln.ssti
      이름: 서버측 템플릿 인젝션(SSTI)
      설명: 입력이 서버 템플릿 엔진에 해석돼 임의 코드 실행
      detector:
        - ssti
      cwe: CWE-1336
    - id: vuln.buffer-overflow
      이름: 버퍼 오버플로우
      설명: 경계 검사 미흡으로 메모리 손상·프로그램 흐름 조작
      detector: []
      cwe: CWE-120
    - id: vuln.format-string
      이름: 포맷 스트링
      설명: 포맷 인자 검증 미흡으로 메모리 변조·임의 접근
      detector: []
      cwe: CWE-134
    - id: vuln.txn-security
      이름: 전자금융 거래 보안
      설명: 거래 인증수단·무결성·재사용 방지·소유주 검증 등 거래 프로세스 보안(수동)
      detector: []
    - id: vuln.auth-credential
      이름: 인증정보 관리 미흡
      설명: 인증정보 재사용·고정·유추 가능성
      detector: []
      cwe: CWE-287
    - id: vuln.client-program
      이름: 클라이언트 보안프로그램 미흡
      설명: OS변조 탐지·악성코드 방지·보안프로그램·난독화·안티디버깅·무결성 등 단말 프로그램 보호(수동)
      detector: []
    - id: vuln.mobile-client
      이름: 모바일 단말 보안 미흡
      설명: 단말 저장·메모리·브라우저·소스코드·백그라운드·딥링크 등 모바일 클라이언트 보호(수동)
      detector: []
